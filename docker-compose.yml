services:
  html:
    image: httpd:2-alpine
    volumes:
      - ./data/web/:/usr/local/apache2/htdocs/:r
      - ./docker/httpd/extra/httpd-vhosts.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf
      - ./docker/httpd/httpd.conf:/usr/local/apache2/conf/httpd.conf
    ports:
      - "8000:80"
    networks:
      - badge

  mockserver:
    image: mockserver/mockserver
    environment:
      MOCKSERVER_SERVER_PORT: 80
      MOCKSERVER_WATCH_INITIALIZATION_JSON: true
      MOCKSERVER_INITIALIZATION_JSON_PATH: /expectations/**mockserver-*.json
    volumes:
      - ./docker/mockserver/expectations/:/expectations/:r
    networks:
      - badge

networks:
  badge: