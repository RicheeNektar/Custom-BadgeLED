<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <title>Not Found</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="lib/bootstrap.min.css">
        <link rel="stylesheet" href="lib/bootstrap-icons.min.css">
        <script src="lib/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <header class="navbar sticky-top">
            <nav class="container">
                <div class="container-fluid">
                    <a class="navbar-brand" href="../">
                        <img src="favicon.ico"  alt="Badge" />
                    </a>
                </div>
            </nav>
        </header>

        <div class="container mt-3">
            <div class="alert alert-danger">
                <h4 class="alert-heading mb-3">
                    <i class="bi bi-exclamation-triangle"></i>&nbsp;<span class="fw-bold">404 Not Found</span>
                </h4>
                <p>The requested page could not be found.</p>
            </div>

            <button class="btn btn-secondary" onclick="history.back()">Try to go back</button>
        </div>
    </body>
</html>
