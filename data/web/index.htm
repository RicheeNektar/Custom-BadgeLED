<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <title>Firmware</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="lib/bootstrap.min.css">
        <link rel="stylesheet" href="lib/bootstrap-icons.min.css">
        <script src="lib/bootstrap.bundle.min.js"></script>

        <script src="util/index.js"></script>
        <script src="util/config.js"></script>
        <script src="util/buffer.js"></script>
        <script src="config.js"></script>
        <script src="index.js"></script>
    </head>
    <body>
        <header class="navbar sticky-top">
            <nav class="container">
                <div class="container-fluid">
                    <a class="navbar-brand" href="../">
                        <img src="favicon.ico"  alt="Badge" />
                    </a>
                </div>
            </nav>
        </header>

        <div class="container mt-3">
            <div class="card mb-3">
                <div class="card-header">
                    LED Animation
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col">
                            <label class="form-label" for="animation">Animation</label>
                            <select class="form-select" id="animation" name="animation" data-config-key="mode">
                                <option value="0">Rotating Gradient</option>
                                <option value="1">Rainbow</option>
                            </select>
                        </div>
                        <div class="col">
                            <label class="form-label" for="primary-hue">Primary Hue</label>
                            <div class="d-flex align-items-center">
                                <input class="me-3 form-range" id="primary-hue" name="primary-hue" type="range" min="0" max="359" data-config-key="primaryHue"
                                    onchange="document.getElementById('primary-hue-preview').value = `hsl(${this.value} 100% 50%)`"
                                />
                                <input class="form-control form-control-color" id="primary-hue-preview" type="color" disabled readonly/>
                            </div>
                        </div>
                        <div class="col">
                            <label class="form-label" for="secondary-hue">Secondary Hue</label>
                            <div class="d-flex align-items-center">
                                <input class="me-3 form-range" id="secondary-hue" name="secondary-hue" type="range" min="0" max="359" data-config-key="secondaryHue"
                                    onchange="document.getElementById('secondary-hue-preview').value = `hsl(${this.value}, 100%, 50%)`"
                                />
                                <input class="form-control form-control-color" id="secondary-hue-preview" type="color" disabled readonly/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="accordion" id="logs">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#logs-collapse" aria-expanded="false">
                            <i id="logs-warning" class="bi bi-exclamation-octagon-fill text-danger me-2 d-none"></i>System Logs
                        </button>
                    </h2>
                    <div id="logs-collapse" class="accordion-collapse collapse" data-bs-parent="#logs">
                        <div class="accordion-body" id="logs-body"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
