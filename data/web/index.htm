<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <title>Firmware</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="/lib/bootstrap.min.css">
        <link rel="stylesheet" href="/lib/bootstrap-icons.min.css">
        <script src="/lib/bootstrap.bundle.min.js"></script>

        <script src="/util/index.js"></script>
        <script src="/util/config.js"></script>
        <script src="/util/buffer.js"></script>
        <script src="/config.js"></script>
        <script src="/index.js"></script>
    </head>
    <body>
        <header class="navbar navbar-expand-lg bg-body-tertiary">
            <nav class="container container-fluid">
                <a class="navbar-brand" href="/">
                    <img src="/favicon.ico"  alt="Badge" />
                </a>
                <button class="navbar-toggler float-end" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/">Animation</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/display">Display</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/network">Network</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/ota">Software Update</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <div class="modal" data-bs-backdrop="static" id="loading">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body text-center">
                        <div class="spinner-border"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container mt-3">
            <div class="card mb-3">
                <div class="card-header">
                    LED Animation
                </div>
                <div class="card-body">
                    <div class="row row-cols-lg-3 row-cols-2">
                        <div class="col p-2 col-12 col-lg-4">
                            <label class="form-label" for="animation">Animation</label>
                            <select class="form-select" id="animation" name="animation" data-config-key="mode">
                                <option value="0">Rotating Gradient</option>
                                <option value="1">Rainbow</option>
                            </select>
                        </div>
                        <div class="col p-2">
                            <label class="form-label" for="primary-hue">Primary Hue</label>
                            <div class="d-flex align-items-center">
                                <input class="me-3 form-range" id="primary-hue" name="primary-hue" type="range" min="0" max="359" data-config-key="primaryHue"
                                    oninput="document.getElementById('primary-hue-preview').value = `hsl(${this.value} 100% 50%)`"
                                />
                                <input class="form-control form-control-color" id="primary-hue-preview" type="color" disabled readonly/>
                            </div>
                        </div>
                        <div class="col p-2">
                            <label class="form-label" for="secondary-hue">Secondary Hue</label>
                            <div class="d-flex align-items-center">
                                <input class="me-3 form-range" id="secondary-hue" name="secondary-hue" type="range" min="0" max="359" data-config-key="secondaryHue"
                                    oninput="document.getElementById('secondary-hue-preview').value = `hsl(${this.value}, 100%, 50%)`"
                                />
                                <input class="form-control form-control-color" id="secondary-hue-preview" type="color" disabled readonly/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="accordion" id="logs">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#logs-collapse" aria-expanded="false">
                            <i id="logs-warning" class="bi bi-exclamation-octagon-fill text-danger me-2 d-none"></i>System Logs
                        </button>
                    </h2>
                    <div id="logs-collapse" class="accordion-collapse collapse" data-bs-parent="#logs">
                        <div class="accordion-body" id="logs-body"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
