<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <title>Firmware</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="/lib/bootstrap.min.css">
        <link rel="stylesheet" href="/lib/bootstrap-icons.min.css">
        <script src="/lib/bootstrap.bundle.min.js"></script>

        <script src="/util/index.js"></script>
        <script src="/util/buffer.js"></script>
        <script src="/ota/index.js"></script>
    </head>
    <body>
        <header class="navbar navbar-expand-lg bg-body-tertiary">
            <nav class="container container-fluid">
                <a class="navbar-brand" href="/">
                    <img src="/favicon.ico"  alt="Badge" />
                </a>
                <button class="navbar-toggler float-end" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/">Animation</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/display">Display</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/network">Network</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/ota">Software Update</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <div class="modal" data-bs-backdrop="static" id="loading">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body text-center">
                        <div class="spinner-border"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container mt-3">

            <h2>Software Update</h2>

            <form id="ota-form">
                <div class="mb-3">
                    <span class="form-label">Currently Installed:</span>
                    <span class="form-label badge bg-secondary float-end" id="current_version"></span>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="firmware">Firmware File</label>
                    <span class="form-label badge bg-primary float-end text-center" id="selected_version"></span>
                    <input class="form-control" id="firmware" type="file" required />
                    <div id="firmware-feedback" class="invalid-feedback">
                        Invalid firmware.
                    </div>
                </div>

                <button class="btn btn-primary" type="submit" onclick="setTimeout(() => this.disabled = true)">Update</button>
            </form>
        </div>
    </body>
</html>
