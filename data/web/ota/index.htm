<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <title>Firmware</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="../lib/bootstrap.min.css">
        <link rel="stylesheet" href="../lib/bootstrap-icons.min.css">
        <script src="../lib/bootstrap.bundle.min.js"></script>

        <script src="../util/index.js"></script>
        <script src="../ota/index.js"></script>
    </head>
    <body>
        <header class="navbar sticky-top">
            <nav class="container">
                <div class="container-fluid">
                    <a class="navbar-brand" href="../">
                        <img src="../favicon.ico"  alt="Badge" />
                    </a>
                </div>
            </nav>
        </header>

        <div class="container mt-3">

            <h2>OTA Update</h2>

            <form id="ota-form" class="card">
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col">
                            Installed: <span class="badge bg-danger text-center" id="current_version"></span>
                        </div>
                        <div class="col">
                            Selected for upload: <span class="badge bg-success text-center" id="selected_version"></span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="firmware">Firmware File</label>
                        <input class="form-control" id="firmware" type="file" />
                    </div>

                    <button class="btn btn-primary" type="submit" onclick="setTimeout(() => this.disabled = true)">Update</button>
                </div>
            </form>
        </div>
    </body>
</html>
