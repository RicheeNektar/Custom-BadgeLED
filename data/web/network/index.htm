<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <title>Network</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="../lib/bootstrap.min.css">
        <link rel="stylesheet" href="../lib/bootstrap-icons.min.css">
        <script src="../lib/bootstrap.bundle.min.js"></script>

        <script src="../util/index.js"></script>
        <script src="../util/config.js"></script>
        <script src="../util/buffer.js"></script>
        <script src="../network/config.js"></script>
        <script src="../network/index.js"></script>
    </head>
    <body>
        <header class="navbar sticky-top">
            <nav class="container">
                <div class="container-fluid">
                    <a class="navbar-brand" href="../">
                        <img src="../favicon.ico"  alt="Badge" />
                    </a>
                </div>
            </nav>
        </header>

        <div class="container mt-3">
            <h2>Access Point</h2>

            <form onsubmit="setTimeout(network.save)" id="network-form" class="card">
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label" for="ap-name">SSID</label>
                        <input class="form-control" type="text" id="ap-name" minlength="1" value="LED-Badge" required />
                    </div>

                    <div class="mb-3 group">
                        <label class="form-label" for="ap-password">Password</label>
                        <input class="form-control" type="password" id="ap-password" minlength="8" placeholder="Leave empty for open AP" />
                    </div>

                    <div class="mb-3">
                        <button class="btn btn-primary" type="submit" onclick="setTimeout(() => this.disabled = true)">Save</button>
                    </div>
                </div>
            </form>
        </div>
    </body>
</html>
