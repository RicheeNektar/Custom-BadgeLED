<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <title>Network</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="/lib/bootstrap.min.css">
        <link rel="stylesheet" href="/lib/bootstrap-icons.min.css">
        <script src="/lib/bootstrap.bundle.min.js"></script>

        <script src="/util/index.js"></script>
        <script src="/util/config.js"></script>
        <script src="/util/buffer.js"></script>

        <script src="/network/config.js"></script>
        <script src="/network/index.js"></script>
    </head>
    <body>
        <header class="navbar navbar-expand-lg bg-body-tertiary">
            <nav class="container container-fluid">
                <a class="navbar-brand" href="/">
                    <img src="/favicon.ico"  alt="Badge" />
                </a>
                <button class="navbar-toggler float-end" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/">Animation</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/display">Display</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/network">Network</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/ota">Software Update</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <div class="modal" data-bs-backdrop="static" id="loading">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body text-center">
                        <div class="spinner-border"></div>
                    </div>
                </div>
            </div>
        </div>

       <div class="container mt-3">
            <h2>Access Point</h2>

            <form onsubmit="setTimeout(network.save)" id="network-form" class="row">
                <div class="col col-12 col-lg-6 mb-3">
                    <label class="form-label" for="ssid">SSID</label>
                    <input class="form-control" type="text" id="ssid" minlength="1" value="LED-Badge" required data-config-key="ssid" />
                </div>

                <div class="col col-12 col-lg-6 mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" minlength="8" placeholder="Leave empty for open AP" data-config-key="password" />
                </div>

                <div class="mb-3">
                    <button class="btn btn-primary" type="submit" onclick="setTimeout(() => this.disabled = true)">Save</button>
                </div>
            </form>
        </div>
    </body>
</html>
