<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <title>Display</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="/lib/bootstrap.min.css">
        <link rel="stylesheet" href="/lib/bootstrap-icons.min.css">
        <script src="/lib/bootstrap.bundle.min.js"></script>

        <script src="/util/index.js"></script>
        <script src="/util/config.js"></script>
        <script src="/util/buffer.js"></script>

        <script src="/display/config.js"></script>
        <script src="/display/index.js"></script>
    </head>
    <body>
        <header class="navbar navbar-expand-lg bg-body-tertiary">
            <nav class="container container-fluid">
                <a class="navbar-brand" href="/">
                    <img src="/favicon.ico"  alt="Badge" />
                </a>
                <button class="navbar-toggler float-end" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/">Animation</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/display">Display</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/network">Network</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/ota">Software Update</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <div class="modal" data-bs-backdrop="static" id="loading">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body text-center">
                        <div class="spinner-border"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container mt-3">

            <h1>Display</h1>

            <form class="mb-3" id="display-form">
                <div class="row row-cols-1 row-cols-lg-2">
                    <div class="col mb-3">
                        <label class="form-label" for="name">Name</label>
                        <input class="form-control" id="name" maxlength="32" placeholder="Yours, sona's, or others" data-config-key="name" />
                    </div>
                    <div class="col mb-3">
                        <label class="form-label" for="telegram">Telegram</label>
                        <div class="input-group">
                            <span class="input-group-text">@</span>
                            <input class="form-control" id="telegram" name="telegram" maxlength="32" data-config-key="telegram" />
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="form-check form-switch form-check-inline">
                        <input class="form-check-input" type="checkbox" role="switch" name="red-name" id="red-name" data-config-key="redName" />
                        <label class="form-check-label" for="red-name">Red Name</label>
                    </div>

                    <div class="form-check form-switch form-check-inline">
                        <input class="form-check-input" type="checkbox" role="switch" name="invert-colors" id="invert-colors" data-config-key="invertColors" />
                        <label class="form-check-label" for="invert-colors">Inverted Display</label>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="control-group">
                        <label class="form-label" for="description">Description</label>
                        <textarea class="form-control" id="description" maxlength="32" rows="3" ></textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Save</button>
            </form>

            <form class="d-flex mb-3" id="image-form">
                <div class="col col-2 d-flex justify-content-center">
                    <img class="img-fluid" id="preview" src="/api/config/display/image" alt="current image" />
                </div>
                <div class="col ms-3">
                    <label class="form-label" for="image">Image</label>
                    <div class="input-group flex-nowrap">
                        <input class="form-control" type="file" id="image" accept="image/*" />
                        <button class="btn btn-primary" type="submit">Upload</button>
                    </div>
                    <ul class="form-text">
                        <li>Optimal image resolution: <b>64x64</b></li>
                        <li>Optimal aspect ration: <b>1:1</b></li>
                        <li>Maximum upload size: <b>2 MB</b></li>
                    </ul>
                </div>
            </form>
        </div>
    </body>
</html>
