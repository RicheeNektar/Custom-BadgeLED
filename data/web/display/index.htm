<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <title>Display</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="/lib/bootstrap.min.css">
        <link rel="stylesheet" href="/lib/bootstrap-icons.min.css">
        <script src="/lib/bootstrap.bundle.min.js"></script>

        <script src="/util/index.js"></script>
        <script src="/util/config.js"></script>
        <script src="/util/buffer.js"></script>

        <script src="/display/config.js"></script>
        <script src="/display/index.js"></script>
    </head>
    <body>
        <header class="navbar navbar-expand-lg bg-body-tertiary">
            <nav class="container container-fluid">
                <a class="navbar-brand" href="/">
                    <img src="/favicon.ico"  alt="Badge" />
                </a>
                <button class="navbar-toggler float-end" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/">Animation</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/display">Display</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/network">Network</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/ota">Software Update</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <div class="container mt-3">

            <h1>Display</h1>

            <div class="card">
                <div class="control-group">
                    <label for="name">Badge Name / Besitzer</label>
                    <input type="text" id="name" maxlength="31" value="ArdyMoon">
                </div>
                <div class="control-group">
                    <div class="toggle-container">
                        <label>Name in Rot anzeigen</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="nameColorRed" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <p style="font-size: 12px; color: #aaa; margin-top: 5px;">
                        Aus: Name wird Weiss angezeigt
                    </p>
                </div>
            </div>

            <div class="card">
                <div class="control-group">
                    <label for="description">Beschreibung</label>
                    <textarea id="description" maxlength="255"></textarea>
                </div>
            </div>

            <div class="card">
                <div class="control-group">
                    <label for="telegram">Telegram Name (ohne @)</label>
                    <input type="text" id="telegram" maxlength="31">
                </div>
            </div>

            <div class="card">
                <div class="control-group">
                    <label>Bild hochladen (64x64 Pixel)</label>
                    <div class="image-preview" id="imagePreview">
                        <img id="previewImg" src="/config/display/image.bmp" alt="image" />
                        <span id="noImageText">Kein Bild</span>
                    </div>
                    <div class="file-upload">
                        <input type="file" class="file-upload-input" id="imageUpload" accept="image/*" onchange="window.config.uploadImage(this)" >
                        <div class="file-upload-button">Bild hochladen</div>
                    </div>
                    <p style="font-size: 12px; color: #aaa; margin-top: 5px;">
                        <strong>Bild-Upload-Anleitung:</strong><br>
                        • Optimale Pixel: 64x64 Pixel<br>
                        • Unterstuetzte Formate: BMP<br>
                        • Online-Konverter: <a href="https://convertio.co/de/jpg-bmp/" target="_blank" style="color: #00ff88;">convertio.co</a><br>
                        • Das Bild wird rechts unter der Trennlinie angezeigt
                    </p>
                </div>
            </div>

            <div class="card">
                <div class="control-group">
                    <div class="toggle-container">
                        <label>Farben invertieren (schwarzer Hintergrund)</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="invertColors">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="card">
                <button onclick="window.config.save()">Speichern</button>
            </div>
        </div>
    </body>
</html>
